function createHttpDb(){
  if(typeof window==="undefined"||typeof window.fetch!=="function") return null;

    const d=docs.get(p);

  }
  function colSnap(p){
    const list=[];
    docs.forEach((v,k)=>{ if(k.startsWith(p+"/")&&k.slice(p.length+1).indexOf("/")<0) list.push(docSnap(k)); });
    return {docs:list,size:list.length,empty:!list.length,docChanges:()=>[],metadata:{}};
  }
  function emitAll(){
    subs.forEach((set,p)=>{
      const isDoc=p.split("/").length%2===0;
      const snap=isDoc?docSnap(p):colSnap(p);
      set.forEach(fn=>{ try{ fn.next(snap); }catch(e){} });
    });
  }
  async function callApi(body){
    const opt={method:"POST",headers:{"Content-Type":"text/plain;charset=UTF-8"},body:JSON.stringify(Object.assign({key},body))};
    try{ if(typeof AbortSignal!=="undefined"&&AbortSignal.timeout) opt.signal=AbortSignal.timeout(20000); }catch(e){}

    if(!res.ok) throw new Error("HTTP "+res.status);

    if(!j||!j.ok) throw new Error(j&&j.error||"sync error");
    if(j.docs) applyDocs(j.docs);

  }

    if(!initPromise){
      initPromise=callApi({op:"get"}).then(()=>{
        initErr=null; emitAll();
      }).catch(e=>{
        initErr=e; initPromise=null; /* the next get / refresh tries again */

  }
  function docRef(p){
    return {
      id:p.split("/").pop(), path:p,
      get:async()=>{ await ensureInit(); if(initErr) throw initErr; return docSnap(p); },

        const copy=clone(d); docs.set(p,copy);

      },
      delete:async()=>{
        docs.delete(p);

      onSnapshot(next,err){

        ensureInit().then(()=>{ if(!initErr&&subs.get(p)&&subs.get(p).has(entry)) next(docSnap(p)); });
        return ()=>{ if(subs.has(p)) subs.get(p).delete(entry); };

    _http:true,
    doc:p=>docRef(p),
    collection:p=>({
      path:p,
      doc:id=>docRef(p+"/"+id),
      onSnapshot(next,err){

        ensureInit().then(()=>{ if(!initErr&&subs.get(p)&&subs.get(p).has(entry)) next(colSnap(p)); });
        return ()=>{ if(subs.has(p)) subs.get(p).delete(entry); };
      }
    }),
    refresh:()=>callApi({op:"get"}).then(()=>{ initErr=null; emitAll(); return true; }).catch(e=>{ initErr=e; return false; })
  };
}

/* Historical PR lookup for an exercise before a given session id */
function historicalBest(exKey, beforeId){
  const bw=+state.plan.bodyweight||85;
  let maxW=0, maxR=0, max1RM=0, count=0;
  for(const s of state.sessions){
    if(beforeId && s.id===beforeId) continue;
    for(const e of (s.exercises||[])){
      if(e.ex!==exKey) continue;
      for(const st of (e.sets||[])){
        const r=+st.r||0, w=+st.w||0;
        if(r<=0) continue;
        count++;
        if(w>maxW) maxW=w;
        if(r>maxR) maxR=r;
        const e1 = e.unit==="kg"? w*(1+r/30) : e.unit==="bw"? (bw+w)*(1+r/30) : r;
        if(e1>max1RM) max1RM=Math.round(e1*10)/10;
      }
    }
  }
  return {maxW, maxR, max1RM, count};
}
function isSetPR(exKey, unit, w, r, beforeId){
  r=+r||0; w=+w||0; if(r<=0) return null;
  const h=historicalBest(exKey, beforeId);
  if(h.count===0) return null;
  const bw=+state.plan.bodyweight||85;
  const e1 = unit==="kg"? w*(1+r/30) : unit==="bw"? (bw+w)*(1+r/30) : r;
  if((unit==="kg"||unit==="bw") && w>h.maxW && r>=3) return "Weight PR";
  if(Math.round(e1*10)/10 > h.max1RM) return (unit==="kg"||unit==="bw")?"1RM PR":"Rep PR";
  if(unit!=="kg"&&unit!=="bw"&&r>h.maxR) return "Rep PR";
  return null;
}

/* Olympic Barbell Plate Calculator (20 kg bar) */
function calcPlates(totalKg, barKg){
  barKg=barKg||20; totalKg=+totalKg||0;
  if(totalKg<=barKg) return {bar:barKg, perSide:[], rem:0};
  let side=(totalKg-barKg)/2;
  const avail=[25,20,15,10,5,2.5,1.25], out=[];
  for(const p of avail){
    while(side>=p-0.01){ out.push(p); side=Math.round((side-p)*100)/100; }
  }
  return {bar:barKg, perSide:out, rem:side};
}
function renderPlateCalc(weightKg){
  const w=+weightKg||60, res=calcPlates(w,20);
  if(w<=20) return '<div class="plate-vis"><span class="bar-stub">20 kg empty bar</span><span class="small muted">Use dumbbells or a lighter fixed bar for weights under 20 kg.</span></div>';
  const chips=res.perSide.map(p=>'<span class="plate p'+String(p).replace(".","_")+'">'+p+'</span>').join("");
  return '<div class="plate-vis"><span class="bar-stub">20 kg bar</span><span class="small muted">+ each side:</span>'+chips+(res.rem>0?'<span class="small muted">(+'+res.rem+' kg micro)</span>':'')+'<span class="small muted" style="margin-left:auto">Total: <b>'+w+' kg</b></span></div>';
}

/* Muscle status across the 13 anatomical groups */
function computeMuscleStatus(){
  const today=isoToday(), planned=plannedOn(today), lift=liftOf(planned), fb=hasKind(planned,"football"), sp=hasKind(planned,"sport");
  const todayItems = lift ? ((state.plan.sessions[state.plan.track]||{})[lift]||[]) : [];
  const todayPrimary=new Set(), todaySecondary=new Set();
  todayItems.forEach(it=>{ const m=exMeta(it.ex); m.p.forEach(x=>todayPrimary.add(x)); m.s.forEach(x=>todaySecondary.add(x)); });
  if(fb){ ["quads","hamstrings","glutes","calves"].forEach(x=>todaySecondary.add(x)); }
  if(sp){ ["side_delt","rear_delt","calves","quads"].forEach(x=>todaySecondary.add(x)); }
  const out={};
  const weekAgo=addDays(today,-6);
  Object.keys(MUSCLES).forEach(k=>{
    out[k]={key:k, name:MUSCLES[k].n, target:MUSCLES[k].target, setsWeek:0, lastDate:null, daysAgo:99, recovery:100, status:"fresh", todayRole:todayPrimary.has(k)?"primary":todaySecondary.has(k)?"secondary":null};
  });
  for(const s of sortedSessions()){
    const d=s.date;
    const diffDays=Math.max(0,Math.round((new Date(today+"T12:00:00")-new Date(d+"T12:00:00"))/86400000));
    const inWeek = d>=weekAgo && d<=today;
    for(const e of (s.exercises||[])){
      const validSets=(e.sets||[]).filter(x=>+x.r>0).length;
      if(!validSets) continue;
      const m=exMeta(e.ex);
      m.p.forEach(k=>{
        if(!out[k]) return;
        if(inWeek) out[k].setsWeek += validSets;
        if(diffDays < out[k].daysAgo){ out[k].daysAgo=diffDays; out[k].lastDate=d; }
      });
      m.s.forEach(k=>{
        if(!out[k]) return;
        if(inWeek) out[k].setsWeek += validSets*0.5;
        if(diffDays < out[k].daysAgo){ out[k].daysAgo=diffDays; out[k].lastDate=d; }
      });
    }
  }
  Object.values(out).forEach(m=>{
    m.setsWeek=Math.round(m.setsWeek*10)/10;
    if(m.daysAgo===0){ m.recovery=35; m.status="worked"; }
    else if(m.daysAgo===1){ m.recovery=68; m.status="recovering"; }
    else if(m.daysAgo===2){ m.recovery=90; m.status="fresh"; }
    else { m.recovery=100; m.status="fresh"; }
  });
  return out;
}

function effectiveHealth(iso){
  const d=iso||isoToday(), today=isoToday();
  const base=computeAutoHealthDay(d);
  const raw=(state.plan&&state.plan.health&&state.plan.health[d])||{};
  const auth=isAuthoritativeHealthSource(raw.source);
  const out=Object.assign({},base);
  const intradayKeys={steps:1,activeKcal:1,distanceKm:1};
  HEALTH_FIELDS.forEach(k=>{
    if(raw[k]!==undefined&&raw[k]!==null&&raw[k]!==""){
      if(d===today && !auth && intradayKeys[k]){
        out[k]=Math.max(+raw[k]||0, +base[k]||0);
      } else {
        out[k]=raw[k];
      }
    }
  });
  if(raw.source) out.source=raw.source;
  if(raw.syncedAt) out.syncedAt=raw.syncedAt;
  out.authoritative=auth;
  if(auth && raw.steps!==undefined && raw.steps!==""){ out.steps=+raw.steps; }
  const slp=+out.sleep||base.sleep;
  if(raw.sleep!==undefined&&raw.sleep!==""&&(raw.deepRem===undefined||raw.deepRem==="")){
    out.deepHrs=Math.round(slp*0.22*10)/10;
    out.remHrs=Math.round(slp*0.20*10)/10;
    out.deepRem=Math.round((out.deepHrs+out.remHrs)*10)/10;
  } else if(raw.deepRem!==undefined&&raw.deepRem!==""){
    out.deepHrs=Math.round((+out.deepRem)*0.54*10)/10;
    out.remHrs=Math.round((+out.deepRem-out.deepHrs)*10)/10;
  }
  out.coreHrs=Math.max(0,Math.round((slp-(+out.deepRem||0))*10)/10);
  if(auth && raw.distanceKm!==undefined && raw.distanceKm!=="" && +raw.distanceKm>0){
    const rawKm = +raw.distanceKm>100 ? (+raw.distanceKm/1000) : +raw.distanceKm;
    out.distanceKm=Math.round(rawKm*100)/100;
  } else {
    out.distanceKm=Math.round((+out.steps*0.00076)*10)/10;
  }
  out.flights=Math.round((+out.steps||0)/820);
  const doneSess=(state.sessions||[]).filter(s=>s.date===d);
  let sessSets=0;
  doneSess.forEach(s=>(s.exercises||[]).forEach(e=>(e.sets||[]).forEach(st=>{ if(+st.r>0) sessSets++; })));
  out.exerciseMin=Math.round((doneSess.length?Math.max(35,sessSets*2.5):0)+Math.round((+out.steps||0)/100));
  const bw=+state.plan.bodyweight||85;
  const kcalPerStep=bw*0.0008802;
  const sessK=doneSess.reduce((a,s)=>a+estimateSessionKcal(s,bw),0);
  const stepWalkKcal=Math.round((+out.steps||0)*kcalPerStep);
  if(auth && raw.activeKcal!==undefined && raw.activeKcal!=="" && +raw.activeKcal>0){
    out.activeKcal=+raw.activeKcal;
  } else {
    out.activeKcal=stepWalkKcal + sessK;
  }
  out.totalKcal=(+out.basalKcal||base.basalKcal)+(+out.activeKcal||base.activeKcal);
  return out;
}

async function syncAppleHealthNow(opts){

      if(typeof state.db.refresh==="function"){
        try{ await state.db.refresh(); }catch(e){}
      }

        const hd=snap.data();
        const sig=healthPayloadSig(hd);

          state.plan._lastCloudHealthSig=sig;

  setHealthSyncPrefs({

    lastPromptDate: today,
    lastSyncAt: (authToday || cloudUpdated) ? nowStr : curP.lastSyncAt,
    lastSyncMs: Date.now(),

  state.lastHealthSyncTime=nowStr;

  else render();

}

function normalizeHealthDayObj(raw){

        const v=numOrEmpty(raw[k],dec);

  if(out.deepRem!=="" && out.deepRem>24) out.deepRem = Math.round((out.deepRem/60)*10)/10;

  out.hrv = pick(["hrv","heartRateVariability","sdnn","hrv_ms"],0);
  out.steps = pick(["steps","stepCount","step_count"],0);
  out.activeKcal = pick(["activeKcal","activeEnergy","active_kcal","activeCalories","moveKcal"],0);
  out.basalKcal = pick(["basalKcal","restingEnergy","basal_kcal","restingCalories","bmr"],0);

  if(out.distanceKm!=="" && out.distanceKm>100) out.distanceKm = Math.round((out.distanceKm/1000)*100)/100;
  out.vo2max = pick(["vo2max","vo2Max","cardioFitness","vo2"],1);
  out.spo2 = pick(["spo2","bloodOxygen","oxygenSaturation","spo2_pct"],1);
  if(out.spo2!=="" && out.spo2<=1 && out.spo2>0.5) out.spo2 = Math.round(out.spo2*1000)/10;

function mergeHealthDay(iso, norm, sourceLabel){
  if(!iso||!/^\d{4}-\d{2}-\d{2}$/.test(iso)||!norm) return false;
  const cur=todayHealth(iso);
  let changed=false;
  HEALTH_FIELDS.forEach(k=>{
    if(norm[k]!==undefined&&norm[k]!==null&&norm[k]!==""){
      cur[k]=norm[k];
      changed=true;
    }
  });
  if(!changed) return false;
  const src = sourceLabel || norm.source || "Apple Health";
  cur.source = src;
  cur.syncedAt = norm.syncedAt || new Date().toISOString();
  if(isAuthoritativeHealthSource(src) && iso===isoToday()){
    const bw=+state.plan.bodyweight||85;
    const kcalPerStep=bw*0.0008802;
    const doneSess=(state.sessions||[]).filter(s=>s.date===iso);
    const sessK=doneSess.reduce((a,s)=>a+estimateSessionKcal(s,bw),0);
    if(cur.steps!=="" && (norm.distanceKm===undefined||norm.distanceKm===""||+norm.distanceKm===0)){
      cur.distanceKm = Math.round((+cur.steps*0.00076)*100)/100;
    }
    if(cur.steps!=="" && (norm.activeKcal===undefined||norm.activeKcal===""||+norm.activeKcal===0)){
      cur.activeKcal = Math.max(5, Math.round((+cur.steps)*kcalPerStep)+sessK);
    }
  }
  /* Couple Apple Health sleep, weight & bodyFat into the core Fitness plan & daily hub */
  state.plan.daily=state.plan.daily||{};
  if(!state.plan.daily[iso]) state.plan.daily[iso]={protein:0,water:0,sleep:"",feel:"good"};
  if(cur.sleep!==""){
    state.plan.daily[iso].sleep=cur.sleep;
    if(state.form && state.form.date===iso && (state.form.sleep===""||state.form.sleep==null)){
      state.form.sleep=String(cur.sleep);
    }
  }
  if(cur.weight!=="" && iso===isoToday()){
    state.plan.bodyweight=+cur.weight;
  }
  if(cur.weight!==""){
    state.plan.weightLog=state.plan.weightLog||[];
    const idx=state.plan.weightLog.findIndex(x=>x.d===iso);
    if(idx>=0) state.plan.weightLog[idx].w=+cur.weight;
    else state.plan.weightLog.push({d:iso,w:+cur.weight});
  }
  if(cur.bodyFat!=="" && iso===isoToday()){
    state.plan.bio=Object.assign(clone(DEFAULT_BIO),state.plan.bio||{},{bodyFat:+cur.bodyFat});
  }
  return true;
}
function ingestHealthPayload(payload, sourceLabel, silentToast){
  if(!payload) return 0;
  let obj=payload;
  if(typeof payload==="string"){
    const s=payload.trim();
    if(!s) return 0;
    if(s.startsWith("<") && /HealthData|Record/i.test(s)){
      return parseAppleHealthXml(s, sourceLabel||"Apple Health XML");
    }
    try{ obj=JSON.parse(s); }
    catch(e){
      try{ obj=JSON.parse(atob(s.replace(/-/g,"+").replace(/_/g,"/"))); }
      catch(e2){ return parseHealthCsv(s, sourceLabel||"Health CSV"); }
    }
  }
  if(!obj||typeof obj!=="object") return 0;
  const effSource = sourceLabel || obj.source || "Apple Health Shortcut";
  let count=0;
  if(Array.isArray(obj.days || obj.history || obj.samples)){
    const arr=obj.days||obj.history||obj.samples;
    arr.forEach(item=>{
      const d=(item&&(item.date||item.d||item.iso))||isoToday();
      if(mergeHealthDay(String(d).slice(0,10), normalizeHealthDayObj(item), effSource)) count++;
    });
  } else if(obj.health && typeof obj.health==="object" && !Array.isArray(obj.health)){
    Object.keys(obj.health).forEach(d=>{
      if(/^\d{4}-\d{2}-\d{2}$/.test(d)){
        if(mergeHealthDay(d, normalizeHealthDayObj(obj.health[d]), effSource)) count++;
      }
    });
  } else {
    const dateKey = String(obj.date||obj.d||obj.iso||isoToday()).slice(0,10);
    if(mergeHealthDay(dateKey, normalizeHealthDayObj(obj), effSource)) count++;
  }
  if(count>0){
    state.healthSyncModal=null; state.healthScWarn=null; state.healthSetupOpen=false;
    savePlan();
    if(formOpen()) refreshAllRec();
    render();
    if(!silentToast){
      const th=effectiveHealth(isoToday());
      const bits=[];
      if(th.steps!=="") bits.push((+th.steps).toLocaleString()+" steps ("+th.distanceKm+" km)");
      if(th.activeKcal!=="") bits.push(th.activeKcal+" active kcal");
      if(th.sleep!=="") bits.push(th.sleep+"h sleep");
      if(th.rhr!=="") bits.push(th.rhr+" bpm RHR");
      if(th.hrv!=="") bits.push(th.hrv+" ms HRV");
      toast("\u2713 Apple Health synced"+(bits.length?": "+bits.join(" \u00b7 "):" ("+count+" day"+(count>1?"s":"")+")"));
    }
  }
  return count;
}
function parseHealthCsv(csvText, sourceLabel){
  const lines=String(csvText||"").trim().split(/\r?\n/).filter(Boolean);
  if(lines.length<2) return 0;
  const hdr=lines[0].split(",").map(x=>x.trim().replace(/^"|"$/g,""));
  let count=0;
  for(let i=1;i<lines.length;i++){
    const cols=lines[i].split(",").map(x=>x.trim().replace(/^"|"$/g,""));
    const row={};
    hdr.forEach((h,idx)=>{ row[h]=cols[idx]; });
    const d=String(row.date||row.Date||row.day||isoToday()).slice(0,10);
    if(mergeHealthDay(d, normalizeHealthDayObj(row), sourceLabel||"Apple Health CSV")) count++;

function parseAppleHealthXml(xmlText, sourceLabel){

  const cutoff=addDays(isoToday(),-90);
  const byDay={};

    const a=m[1];

    const tp=tpM[1];
    const dtM=/startDate="(\d{4}-\d{2}-\d{2})/.exec(a); if(!dtM) continue;
    const d=dtM[1]; if(d<cutoff) continue;
    const valM=/value="([^"]+)"/.exec(a);
    const val=valM?valM[1]:"";
    const day=ensure(d);
    if(tp==="HKQuantityTypeIdentifierStepCount") day.steps += (+val||0);
    else if(tp==="HKQuantityTypeIdentifierActiveEnergyBurned") day.activeKcal += (+val||0);
    else if(tp==="HKQuantityTypeIdentifierBasalEnergyBurned") day.basalKcal += (+val||0);
    else if(tp==="HKQuantityTypeIdentifierDistanceWalkingRunning") day.distanceKm += (+val||0);
    else if(tp==="HKQuantityTypeIdentifierRestingHeartRate" && +val>0) day.rhr.push(+val);
    else if(tp==="HKQuantityTypeIdentifierHeartRateVariabilitySDNN" && +val>0) day.hrv.push(+val);
    else if(tp==="HKQuantityTypeIdentifierVO2Max" && +val>0) day.vo2max.push(+val);
    else if(tp==="HKQuantityTypeIdentifierOxygenSaturation" && +val>0) day.spo2.push(+val<=1?(+val*100):+val);
    else if(tp==="HKQuantityTypeIdentifierRespiratoryRate" && +val>0) day.respRate.push(+val);
    else if(tp==="HKQuantityTypeIdentifierBodyMass" && +val>0) day.weight.push(+val);
    else if(tp==="HKQuantityTypeIdentifierBodyFatPercentage" && +val>0) day.bodyFat.push(+val<=1?(+val*100):+val);
    else if(tp==="HKCategoryTypeIdentifierSleepAnalysis" && /Asleep/i.test(val)){

        if(mins>0 && mins<960){
          day.sleepMin += mins;

        }
      }
    }
  }
  const avg=arr=>arr.length?(arr.reduce((a,b)=>a+b,0)/arr.length):"";
  let count=0;
  Object.keys(byDay).sort().forEach(d=>{
    const x=byDay[d];
    const norm=normalizeHealthDayObj({
      sleep: x.sleepMin>0 ? Math.round((x.sleepMin/60)*10)/10 : "",
      deepRem: x.deepRemMin>0 ? Math.round((x.deepRemMin/60)*10)/10 : "",
      rhr: avg(x.rhr),
      hrv: avg(x.hrv),
      steps: x.steps>0 ? Math.round(x.steps) : "",
      activeKcal: x.activeKcal>0 ? Math.round(x.activeKcal) : "",
      basalKcal: x.basalKcal>0 ? Math.round(x.basalKcal) : "",
      distanceKm: x.distanceKm>0 ? Math.round(x.distanceKm*100)/100 : "",
      vo2max: avg(x.vo2max),
      spo2: avg(x.spo2),
      respRate: avg(x.respRate),
      weight: x.weight.length ? x.weight[x.weight.length-1] : "",
      bodyFat: x.bodyFat.length ? x.bodyFat[x.bodyFat.length-1] : ""
    });
    if(mergeHealthDay(d, norm, sourceLabel||"Apple Health XML")) count++;

    }
  }
  if(targetOffset<0){
    let p=0;
    while(p+30<=u8.length){
      if(dv.getUint32(p,true)!==0x04034b50) break;

/* Rolling 7-day / 14-day Personal Baselines for Apple Health Metrics */

function healthBaseline(metricKey, daysCount, beforeIso){
  daysCount=daysCount||7;
  const end=beforeIso||isoToday();
  const h=state.plan.health||{};
  const vals=[];
  for(let i=1;i<=daysCount*2 && vals.length<daysCount;i++){
    const d=addDays(end,-i);
    const v=h[d]&&h[d][metricKey];
    if(v!==undefined&&v!==null&&v!==""&&Number.isFinite(+v)) vals.push(+v);

  if(vals.length>=2){
    const mean=vals.reduce((a,b)=>a+b,0)/vals.length;
    return {mean:Math.round(mean*10)/10, count:vals.length, personal:true, min:Math.min(...vals), max:Math.max(...vals)};
  }
  const autoVals=[];
  for(let i=1;i<=daysCount;i++){

    if(v!==undefined&&v!==null&&v!==""&&Number.isFinite(+v)) autoVals.push(+v);

  });

  const withSleep=state.sessions.filter(s=>s.sleep!==""&&s.sleep!=null&&sessionVolume(s)>0);

    }
  }
  insights.push({
    c: acwr.zone==="high"?"warn":"good",
    t: "Cardio-Muscular Longevity & Strain Balance (ACWR "+acwr.ratio+"x)",
    b: "Combining your VO2 Max ("+vo2+" mL/kg/min) with "+TIER_NAMES[maxTier]+" relative strength and "+mf.ffmi+" FFMI places your physiological age at "+bioAge+" yrs ("+(ageDiff<=0?ageDiff+" yrs younger": "+"+ageDiff+" yrs")+"). "+acwr.advice
  });

/* Web Audio API Chime & Rest Timer Dock. One AudioContext, created and resumed on a tap (iOS plays nothing from a timer otherwise). */
let audioCtx=null;
function ensureAudio(){ try{ const Ctx=(typeof window!=="undefined")&&(window.AudioContext||window.webkitAudioContext); if(!Ctx) return; if(!audioCtx) audioCtx=new Ctx(); if(audioCtx.state==="suspended") audioCtx.resume(); }catch(e){} }
/* Screen wake lock while a session is open (Chrome Android, Safari 16.4+); silently ignored elsewhere. */
let wakeLock=null;
async function keepAwake(on){ try{ const wl=(typeof navigator!=="undefined")&&navigator.wakeLock; if(!wl) return; if(on){ if(!wakeLock&&typeof document!=="undefined"&&document.visibilityState==="visible"){ wakeLock=await wl.request("screen"); wakeLock.addEventListener("release",()=>{ wakeLock=null; }); } } else if(wakeLock){ const w=wakeLock; wakeLock=null; await w.release(); } }catch(e){ wakeLock=null; } }
function playGymChime(){
  try{ if(typeof navigator!=="undefined"&&navigator.vibrate) navigator.vibrate([150,80,150,80,250]); }catch(e){}
  try{
    ensureAudio(); const ctx=audioCtx;
    if(!ctx) return;
    [523.25, 659.25, 783.99].forEach((freq,idx)=>{
      const osc=ctx.createOscillator(), g=ctx.createGain();
      osc.type="sine"; osc.frequency.value=freq;
      g.gain.setValueAtTime(0.12, ctx.currentTime+idx*0.11);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+idx*0.11+0.35);
      osc.connect(g); g.connect(ctx.destination);
      osc.start(ctx.currentTime+idx*0.11); osc.stop(ctx.currentTime+idx*0.11+0.36);
    });
  }catch(e){}
}
let restInterval=null, mobInterval=null, workoutClockInterval=null;
function fmtClock(sec){ sec=Math.max(0,Math.floor(+sec||0)); const m=Math.floor(sec/60), s=sec%60; return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0"); }

/* The rest timer counts against a wall-clock deadline, so it stays right when the phone sleeps or the app is in the background. */
function tickRest(){
  const r=state.rest; if(!r.running) return;
  r.sec=Math.max(0,Math.ceil(((r.endAt||0)-Date.now())/1000));
  if(r.sec>0 && r.sec<=3 && !r.pushFgCancel && typeof document!=="undefined" && document.visibilityState==="visible"){ r.pushFgCancel=true; cancelTimerPush(); }

function suggestion(item, last, missed){

  const sets=last.e.sets.filter(s=>setCounts(last.e,s)); if(!sets.length) return {k:"new",t:"No reps logged last time."};
  const w=sets[0].w||0, allTop=sets.every(s=>s.r>=item.max), allMin=sets.every(s=>s.r>=item.min), full=sets.length>=item.sets;
  if(missed>0){ const loaded=(u==="kg"||u==="bw"); return {k:"repeat",t:"Missed "+missed+" planned session"+(missed>1?"s":"")+" since this was last logged. Repeat last time: "+(loaded?"same "+w+" "+unitLabel(u)+", ":"same variation, ")+"same sets and reps. Progress again after a full week done.",w:loaded?w:undefined}; }

function sparkSvg(pts){ const W=600,H=90,p=12; const vs=pts.map(x=>x.v); let lo=Math.min(...vs), hi=Math.max(...vs); if(hi===lo){hi+=1;lo-=1;} const pad=(hi-lo)*.15; lo-=pad; hi+=pad;

function renderGuide(){
  return '<div class="card stack rules"><h2>How to use this</h2><ol>'+guideWeekLi()+'<li><b>Today</b> tells you what is on. Press Start session and the log opens with last time’s weights filled in. No gym today? Press <b>Do A as calisthenics</b> (or B): the same session runs on bodyweight and the pull-up bar, push-ups, pike push-ups, chin-ups, dips. The week still counts it as done.</li><li>Do the set, type what you actually did. Finish with the <b>Next time</b> line before you leave the gym.</li><li><b>Plan</b> is where you set the default week, swap exercises or change sets and rep ranges. It saves by itself.</li><li><b>One week only:</b> on Today, use the arrows to see any week and <b>Edit this week</b> to take football or padel off, move A and B, or put a lift and a game on the same day, for that week alone. The default week is untouched. A and B stay in every week.</li><li><b>Library</b> has the step-by-step cues and a video link for every movement, warm-up drill and stretch.</li></ol></div>'+
  '<div class="card stack rules"><h2>The rules that make it work</h2><ol><li><b>Progressive overload.</b> Three sets per exercise, 8 to 12 reps on the main lifts, 10 to 15 on the smaller ones. Start a weight where the bottom of the rep range leaves 1 or 2 reps in the tank. Each session try to add a rep. At the top of the range on all sets, add 2.5 kg (dumbbells) or 5 kg (barbell) and drop back to the bottom of the range. Bodyweight moves: add reps, then move up the ladder. The log applies this rule for you and shows a recommended weight and reps per set. It also reads the block week (learning, push, deload), your sleep, the Hold box (tick it when you are tired, played football, or are short on time: reps only, no weight jump that day), how last time felt, and the reps you type as you go: over the range and the next set goes up, under it and the next set comes down. Easy / About right / Hard on each exercise nudges it on the spot.</li><li><b>Pull as much as you push.</b> Every push exercise has a pull partner in the same session. Non-negotiable for shoulder health.</li><li><b>Stop 1 to 2 reps short of failure</b> on most sets. Failure only on the last set of an isolation move.</li><li><b>Rest 2 minutes</b> between sets of press, row and pull-up; 60 to 90 seconds on isolation moves.</li><li><b>Log every session.</b> Without the log you cannot apply rule 1.</li><li><b>Form before load.</b> Full range, 2 seconds down, no bouncing. If you cheat the last rep, the weight is too heavy.</li><li><b>Deload every 6 to 8 weeks.</b> Week 7 of the block: half the sets, about 70 percent of the weight.</li><li><b>Missed a session, repeat the week.</b> If a planned A or B did not happen, the next session opens with the same sets, reps and weights as last time instead of the progression. That way a few weeks off never hands you a workout you are not ready for. Progress resumes once a full week is done.</li></ol></div>'+
  '<div class="card stack rules"><h2>Warm-up, every session, 5 to 8 minutes</h2><ol><li>2 to 3 minutes easy movement: rowing machine, skipping, or arm circles and jumping jacks. <a href="'+yt(EX.cardio.q)+'" target="_blank" rel="noopener">video</a></li><li>Band pull-aparts or scapular wall slides, 2 x 15. <a href="'+yt(EX.bandpullapart.q)+'" target="_blank" rel="noopener">video</a></li><li>Shoulder dislocates with a band or towel, 2 x 10. <a href="'+yt(EX.dislocate.q)+'" target="_blank" rel="noopener">video</a></li><li>First exercise of the day: two light ramp-up sets, about 50 then 75 percent of the working weight. Not logged.</li></ol></div>'+
  '<div class="card stack rules"><h2>Cool-down and stretching, 5 minutes</h2><ol><li>Doorway chest stretch, 30 s each side. <a href="'+yt(EX.doorway.q)+'" target="_blank" rel="noopener">video</a></li><li>Lat stretch, hang from the bar or hold a post, 2 x 30 s. <a href="'+yt(EX.latstretch.q)+'" target="_blank" rel="noopener">video</a></li><li>Cross-body shoulder and overhead triceps stretch, 30 s each side.</li><li>Cat-cow and thoracic rotations, 10 each, then child’s pose 45 s. <a href="'+yt(EX.catcow.q)+'" target="_blank" rel="noopener">video</a></li><li>After football: hip flexor and hamstring stretch, foam roll if sore. <a href="'+yt(EX.hipflex.q)+'" target="_blank" rel="noopener">video</a></li></ol><p class="small muted">Stretch after, not before heavy sets. Static stretching before pressing lowers force output for a while.</p></div>'+
  guideRecovery()+
  '<div class="card stack rules"><h2>The first 12 weeks</h2><ol><li><b>Weeks 1 to 2:</b> learn the movements, weights lighter than you think. Film bench, row and press once and compare to the video.</li><li><b>Weeks 3 to 6:</b> apply rule 1 every session. A rep or 2.5 kg somewhere each week.</li><li><b>Week 7:</b> deload.</li><li><b>Weeks 8 to 12:</b> keep progressing. Expect bench up 15 to 25 kg from the start and unassisted pull-ups.</li><li>After week 12: swap a few exercises in Plan (bench to dumbbell bench, lat pulldown to cable row), press Start a new block on Today, same rules.</li></ol></div>';
